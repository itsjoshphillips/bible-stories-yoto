# Cast and audio settings. Edit voice_id values after running:
#   python3 pipeline/storyteller.py voices      (lists voices on your ElevenLabs account)
#   python3 pipeline/storyteller.py audition    (renders one sample line per slot)
# The voice_id values below are ElevenLabs stock voices recalled from memory and
# NOT verified against the live API; treat them as placeholders until auditioned.

[model]
id = "eleven_v3"          # try "eleven_v4" if your account has it; both accept audio tags
output_format = "mp3_44100_128"
max_chars = 1800          # ElevenLabs advises <= 2,000 characters per dialogue request
# stability = 0.5         # uncomment to send settings.stability
# seed = 7                # uncomment for more repeatable takes

[audio]
loudness = -16.0          # LUFS target for speech
tempo = 0.95              # < 1.0 slows delivery slightly for small listeners, pitch unchanged
gap = 0.45                # seconds of silence between consecutive speech chunks
scene_pause = 1.2         # seconds for a [SCENE] break
lead_in = 0.4             # silence at the very start of a track
tail = 1.5                # silence at the very end of a track
intro = "assets/intro.mp3"   # optional musical sting; skipped if the file is absent
outro = "assets/outro.mp3"   # optional; skipped if absent
sfx_loudness = -27.0      # sound effects sit well under the voices
verify_threshold = 0.90   # minimum transcript similarity before a chunk is flagged

# Ten slots at most: the dialogue endpoint allows 10 unique voices per request.
[voices]
narrator    = { voice_id = "JBFqnCBsd6RMkjVDRZzb", note = "George: warm British storyteller" }
